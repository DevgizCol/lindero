name: CI & Keep-Alive de Producción

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Ping cada 10 minutos (Render duerme a los 15 min; 10 min da 5 min de tolerancia ante retrasos de cola)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  test:
    name: Verificación Cartográfica y Seguridad
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilación sintáctica
        run: |
          python -m py_compile web/app.py motor/pipeline.py motor/excel.py motor/poligonos.py

      - name: Ejecutar pruebas del motor cartográfico
        run: |
          python tests/prueba_sin_qgis.py

  keep-alive:
    name: Keep-Alive Render 24/7
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Health Ping a Render Producción con Reintentos
        run: |
          for i in 1 2 3; do
            echo "Enviando ping #$i a Render..."
            if curl -s -f -m 25 https://lindero.onrender.com/salud; then
              echo "✅ Servidor Lindero PRO activo y respondiendo."
              exit 0
            fi
            echo "Reintentando en 5 segundos..."
            sleep 5
          done
          echo "⚠️ El servidor no respondió tras 3 intentos."
